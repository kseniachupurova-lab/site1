<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Подписные издания</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <div class="logo">
            <img src="src/logo.png" alt="">
        </div>

        <nav>
            <a href="">Ассортимент</a>
            <a href="">Адреса магазинов</a>
            <a href="">Поддержка и контакты</a>
        </nav>
    </header>
    <main>
        <section class="cover">
            <div class="info">
                <div class="text">
                    <h1>Книги <br> для всех</h1>
                    <p>Продаем книги с 1926 года</p>
                    <nav>
                        <a href=""><img src="src/yandex.png" alt=""></a>
                        <a href=""><img src="src/ok.png" alt=""></a>
                        <a href=""><img src="src/vk.png" alt=""></a>
                    </nav>
                </div>
                <button>Смотреть каталог</button>
            </div>

            <div class="cover-img">
                <img src="src/mainImage.png" alt="">
            </div>
        </section>

        <section class="areas">
            <h1>Основные направления</h1>
            <div class="row">
                <div class="row-item">
                    <img src="src/photo1.png" alt="">
                    <p class="caption">Классическая <br> и современная <br> художественная проза</p>
                </div>
                <div class="row-item">
                    <img src="src/photo2.png" alt="">
                    <p class="caption">Философия и история</p>
                </div>
                <div class="row-item">
                    <img src="src/photo3.png" alt="">
                    <p class="caption">Литературоведение <br> и история театра и кино</p>
                </div>
                <div class="row-item">
                    <img src="src/photo4.png" alt="">
                    <p class="caption">Альбому по искусству,<br> книги и журналы</p>
                </div>
            </div>
        </section>
    </main>
</body>
</html>
